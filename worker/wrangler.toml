name = "prompt-atelier"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Markdown-файлы базы знаний подключаются как текст
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Адрес сайта, которому разрешено обращаться к серверу (GitHub Pages)
ALLOWED_ORIGIN = "https://udakhina1608-sudo.github.io"

# Ключ хранится как секрет, не в этом файле:
#   npx wrangler secret put ANTHROPIC_API_KEY
